<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" role="img" aria-labelledby="title desc">
  <title id="title">D35E character sheet Spell Save DC summary</title>
  <desc id="desc">A Foundry-style D35E spellbook summary row with Total Caster Level, Concentration, Arcane Spell Failure, and Spell Save DC boxes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f302c"/>
      <stop offset="1" stop-color="#171916"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1040" height="520" fill="url(#bg)"/>
  <rect x="90" y="58" width="860" height="390" rx="6" fill="#e9dfc9" filter="url(#shadow)"/>
  <rect x="90" y="58" width="860" height="58" rx="6" fill="#3b2f25"/>
  <text x="124" y="95" fill="#f7ead2" font-family="Georgia, serif" font-size="26" font-weight="700">Wizard</text>
  <text x="830" y="95" fill="#d7c4a7" font-family="Arial, sans-serif" font-size="18" text-anchor="end">Spells</text>
  <rect x="118" y="146" width="160" height="74" rx="3" fill="#f5eedf" stroke="#9f8768"/>
  <text x="198" y="171" fill="#3b2f25" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TOTAL CASTER LEVEL</text>
  <text x="198" y="204" fill="#111" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">12</text>
  <rect x="296" y="146" width="160" height="74" rx="3" fill="#f5eedf" stroke="#9f8768"/>
  <text x="376" y="171" fill="#3b2f25" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CONCENTRATION</text>
  <text x="376" y="204" fill="#111" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">19</text>
  <rect x="474" y="146" width="160" height="74" rx="3" fill="#f5eedf" stroke="#9f8768"/>
  <text x="554" y="171" fill="#3b2f25" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ARCANE SPELL FAILURE</text>
  <text x="554" y="204" fill="#111" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">0%</text>
  <rect x="652" y="146" width="242" height="74" rx="3" fill="#f5eedf" stroke="#9f8768"/>
  <text x="773" y="171" fill="#3b2f25" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SPELL SAVE DC</text>
  <text x="773" y="198" fill="#111" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">10 + 6 (INT mod) + spell level</text>
  <text x="773" y="215" fill="#6e5c49" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Formula: 10 + @sl + @ablMod</text>
  <line x1="118" y1="252" x2="894" y2="252" stroke="#b89d7b"/>
  <text x="118" y="294" fill="#2d211a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Primary Spellbook</text>
  <rect x="118" y="322" width="776" height="58" rx="3" fill="#fff8ea" stroke="#c9b18f"/>
  <text x="144" y="358" fill="#3b2f25" font-family="Arial, sans-serif" font-size="18">Prepared spells remain in the native D35E sheet layout.</text>
  <text x="520" y="492" fill="#bfa98d" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Illustrative screenshot of the module's spellbook summary enhancement</text>
</svg>
